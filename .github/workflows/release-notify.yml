name: release-notify

# When a release PR (dev -> main) or a hotfix PR is merged into main:
#   - create the git tag and GitHub Release from the version in the PR title,
#   - comment on the PR mentioning the repository owner, which sends a GitHub notification.
# The PR title must look like: "Release v0.1.0 - Sprint 0" (or "Hotfix v0.1.1 - <summary>").
# Extra channels (Slack, email) can be added as further steps here.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.pull_request.merged == true && (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from PR title
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag=$(printf '%s' "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$tag" ]; then
            echo "::error::PR title must contain a version like v0.1.0 (got: $PR_TITLE)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$TAG" --target "$TARGET" --title "$TAG - $PR_TITLE" --generate-notes

      - name: Notify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --body "@${OWNER} Release ${TAG} is published: ${REPO_URL}/releases/tag/${TAG}"
